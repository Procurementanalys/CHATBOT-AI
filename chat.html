<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procurement AI Analyst</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3EF;--surface:#FFFFFF;--surface2:#FAF8F4;--text:#1B232B;--muted:#5B6670;--accent:#0E8F7A;--accent-ink:#fff;--border:#DDD8CE;}
@media (prefers-color-scheme: dark){:root{--bg:#12181C;--surface:#1B232B;--surface2:#202A32;--text:#E8ECEF;--muted:#8A97A3;--accent:#33C2A6;--accent-ink:#0B1210;--border:#2A333B;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace}
.app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto;}
.header{padding:22px 26px 16px;flex:none;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;}
.header-icon{font-size:26px}
.header h1{font-size:18px;margin:0 0 4px}
.header p{color:var(--muted);font-size:13px;margin:0}
.chatlog{flex:1;overflow-y:auto;padding:18px 26px;display:flex;flex-direction:column;gap:14px;}
.empty-state{margin:auto;text-align:center;max-width:420px;padding:20px;}
.empty-state .bubble{font-size:30px;margin-bottom:14px}
.empty-state p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.suggest{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.chip{font-size:12px;color:var(--text);border:1px solid var(--border);border-radius:20px;padding:8px 14px;cursor:pointer;background:var(--surface);}
.chip:hover{border-color:var(--accent);color:var(--accent);}
.msg{max-width:640px;font-size:13.5px;line-height:1.55;}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:12px 12px 3px 12px;}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);padding:12px 15px;border-radius:12px 12px 12px 3px;}
.msg.bot table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.msg.bot th,.msg.bot td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.chatinputbar{border-top:1px solid var(--border);padding:14px 26px;display:flex;gap:10px;background:var(--bg);flex:none;}
.chatinputbar input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--text);font-size:13.5px;font-family:inherit;}
.sendbtn{width:38px;height:38px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;cursor:pointer;font-size:15px;}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-icon">📦</div>
    <div><h1>Procurement AI Analyst</h1><p>Tanya soal stock, forecast, purchasing, sales, atau OOS.</p></div>
  </div>
  <div class="chatlog" id="chatlog">
    <div class="empty-state" id="emptyState">
      <div class="bubble">💬</div>
      <p>Tanya apa saja soal stock, forecast, purchasing, sales, atau OOS.</p>
      <div class="suggest">
        <div class="chip" data-q="Tolong hitungkan forecast bulan depan berdasarkan 3 bulan sales terakhir, serta hitungkan MOI nya juga">Hitungkan forecast bulan depan & MOI</div>
        <div class="chip" data-q="Breakdown item kategori Pareto A">Breakdown item kategori Pareto A</div>
        <div class="chip" data-q="SKU mana yang berisiko OOS?">SKU mana yang berisiko OOS?</div>
      </div>
    </div>
  </div>
  <div class="chatinputbar">
    <input type="text" id="chatInput" placeholder="Tulis pertanyaan analisa kamu...">
    <button class="sendbtn" id="sendBtn">➤</button>
  </div>
</div>

<script type="module">
import { computeForecastAndMOI, computeBreakdown, computeOOSRisk, extractCategoryKeyword, askAIInsight, askAIGeneral, fmt } from './shared.js';
import { AI_ENDPOINT } from './ai-config.js';

const chatlog=document.getElementById('chatlog'),chatInput=document.getElementById('chatInput'),sendBtn=document.getElementById('sendBtn');
function addMsg(role,html){ const d=document.createElement('div');d.className='msg '+role;d.innerHTML=html; chatlog.appendChild(d);chatlog.scrollTop=chatlog.scrollHeight; return d;}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{chatInput.value=c.dataset.q;send();});
sendBtn.onclick=send; chatInput.onkeydown=e=>{if(e.key==='Enter') send();};

async function send(){
  const text=chatInput.value.trim(); if(!text) return;
  const es=document.getElementById('emptyState'); if(es) es.remove();
  addMsg('user',escapeHtml(text)); chatInput.value='';
  const thinking=addMsg('bot','Menghitung...');
  try{ thinking.innerHTML=await routeQuery(text); }
  catch(err){ thinking.innerHTML='Ada kendala saat menganalisa: '+escapeHtml(err.message||String(err)); }
  chatlog.scrollTop=chatlog.scrollHeight;
}

async function routeQuery(text){
  const lower=text.toLowerCase();
  const wantsForecast=lower.includes('forecast')||lower.includes('perkiraan')||lower.includes('proyeksi');
  const wantsMOI=lower.includes('moi');
  const wantsBreakdown=lower.includes('breakdown')||lower.includes('kategori');
  const wantsOOS=lower.includes('oos')||lower.includes('kehabisan')||lower.includes('stok habis')||lower.includes('berisiko');

  if(wantsForecast||wantsMOI){
    const r=await computeForecastAndMOI();
    if(!r.ok) return `Data tidak ditemukan. ${r.reason}`;
    let html=`<b>Analisa berdasarkan sales periode: ${r.salesPeriods.join(', ')}</b>`;
    if(wantsForecast){
      html+=`<br>Rata-rata total sales/bulan: <span class="mono">${fmt(r.avgMonthlyTotal)}</span> unit`;
      html+=`<br>Forecast bulan depan (moving avg + tren): <span class="mono">${fmt(r.totalForecast)}</span> unit`;
    }
    if(wantsMOI){
      if(!r.hasStock){ html+=`<br><i>Data tidak ditemukan: Stock On Hand belum diupload — MOI tidak bisa dihitung.</i>`; }
      else{
        html+=`<br>Stock saat ini: <span class="mono">${fmt(r.stockTotal)}</span> unit`;
        html+=`<br>MOI saat ini (stock ÷ rata-rata sales): <span class="mono">${r.moiNow!==null?fmt(r.moiNow)+' bulan':'-'}</span>`;
        html+=`<br>MOI untuk next purchase (stock ÷ forecast): <span class="mono">${r.moiNext!==null?fmt(r.moiNext)+' bulan':'-'}</span>`;
      }
    }
    const summary=`rata-rata sales/bulan=${fmt(r.avgMonthlyTotal)} unit, forecast bulan depan=${fmt(r.totalForecast)} unit, stock saat ini=${r.hasStock?fmt(r.stockTotal)+' unit':'tidak ada data'}, MOI saat ini=${r.moiNow!==null?fmt(r.moiNow)+' bulan':'tidak ada data'}, MOI next purchase=${r.moiNext!==null?fmt(r.moiNext)+' bulan':'tidak ada data'}`;
    const insight=await askAIInsight(AI_ENDPOINT, summary, text);
    if(insight) html+=`<div style="color:var(--muted);font-size:12px;margin-top:8px;border-top:1px solid var(--border);padding-top:8px">💡 ${escapeHtml(insight)}</div>`;
    return html;
  }

  if(wantsOOS){
    const r=await computeOOSRisk();
    if(!r.ok) return `Data tidak ditemukan. ${r.reason}`;
    if(!r.count) return 'Tidak ada SKU yang terdeteksi berisiko OOS saat ini (MOI semua di atas 0.5 bulan).';
    let html=`<b>${r.count} SKU berisiko kehabisan stok (MOI &lt; 0.5 bulan)</b><table><tr><th>SKU</th><th>Nama</th><th>Stock</th><th>Avg Sales/bln</th><th>MOI</th></tr>`;
    r.risky.slice(0,20).forEach(it=>{ html+=`<tr><td class="mono">${escapeHtml(it.sku)}</td><td>${escapeHtml(it.name)}</td><td class="mono">${fmt(it.stock)}</td><td class="mono">${fmt(it.avgMonthly)}</td><td class="mono">${fmt(it.moi)}</td></tr>`; });
    html+='</table>';
    if(r.count>20) html+=`<div style="color:var(--muted);font-size:11.5px;margin-top:6px">Menampilkan 20 dari ${r.count} SKU berisiko.</div>`;
    return html;
  }

  if(wantsBreakdown){
    const kw=extractCategoryKeyword(text);
    if(!kw) return 'Kategori apa yang mau dibreakdown? Contoh: "breakdown kategori seasonal".';
    const r=await computeBreakdown(kw);
    if(!r.ok) return `Data tidak ditemukan. ${r.reason}`;
    if(!r.count) return `Data tidak ditemukan untuk kategori "${escapeHtml(kw)}".`;
    let html=`<b>${r.count} item pada kategori "${escapeHtml(kw)}"</b><table><tr><th>SKU</th><th>Nama</th><th>Pareto</th><th>Sales terakhir</th></tr>`;
    r.items.slice(0,25).forEach(it=>{ html+=`<tr><td class="mono">${escapeHtml(it.sku)}</td><td>${escapeHtml(it.name)}</td><td>${escapeHtml(r.paretoMap[it.sku]||'-')}</td><td class="mono">${fmt(r.salesMap[it.sku]||0)}</td></tr>`; });
    html+='</table>';
    if(r.count>25) html+=`<div style="color:var(--muted);font-size:11.5px;margin-top:6px">Menampilkan 25 dari ${r.count} item.</div>`;
    return html;
  }

  const generalReply=await askAIGeneral(AI_ENDPOINT, text);
  if(generalReply) return escapeHtml(generalReply).replace(/\n/g,'<br>');
  return 'Hmm, pertanyaan itu belum saya kenali 🤔 Coba pakai kata kunci seperti:<br>• "forecast" atau "MOI"<br>• "breakdown kategori ..."<br>• "OOS" / "berisiko kehabisan stok"';
}
</script>
</body>
</html>
